name: Gemini Model Auto-Updater

on:
  schedule:
    - cron: '0 2 * * 1' # Every Monday at 2:00 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install python-dotenv requests google-generativeai

      - name: Check and validate new models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_gemini_models.py

      - name: Commit and Push Model Update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[SYSTEM_MAINTENANCE] :: Auto-upgrade Gemini model"
          file_pattern: "scripts/config.py README.md"
