name: Ask AI Assistant
description: "Ask a question about the repositories, data platforms, or AI architectures"
title: "[Question] Profile Assistant Query"
labels: ["question", "ai-chat"]
body:
  - type: markdown
    attributes:
      value: "### 💬 Profile Assistant\n\nAsk a technical question regarding public repositories, architecture, cloud infrastructure, or data pipelines.\n\n*Responses are generated automatically by the profile agent and logged to the [README](https://github.com/Brauxo/Brauxo).*"
  - type: textarea
    id: question
    attributes:
      label: "Your Question"
      description: "Keep it focused on technical projects and open-source architecture."
      placeholder: "e.g., What technologies are used in the Bitcoin Analytics pipeline?"
    validations:
      required: true
